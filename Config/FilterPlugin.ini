; und ohne die Datei bleiben sie leer.
;
; Die Fab-Pruefung vom 20.08.2026 hat das hier bemaengelt, weil DESCRIPTION.md fehlte —
; jede einzelne Datei ausserhalb der Struktur muss aufgezaehlt sein, nicht nur die
; wichtigen. `Tools/build_fab_package.py` prueft das jetzt vor dem Packen.
